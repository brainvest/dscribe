<div class="ribbon">
  <nav class="ribbon__tabs" role="tablist">
    @for (tab of tabs(); track tab.label; let i = $index) {
      <button
        type="button"
        role="tab"
        class="ribbon__tab"
        [class.is-active]="i === activeIndex()"
        [attr.aria-selected]="i === activeIndex()"
        (click)="selectTab(i)"
      >
        {{ tab.label }}
      </button>
    }
    <span class="spacer"></span>
    <button
      type="button"
      class="ribbon__collapse"
      [matTooltip]="collapsed() ? 'Expand the ribbon' : 'Collapse the ribbon'"
      (click)="collapsed.set(!collapsed())"
    >
      <mat-icon>{{ collapsed() ? 'expand_more' : 'expand_less' }}</mat-icon>
    </button>
  </nav>

  @if (!collapsed()) {
    <div class="ribbon__band" role="tabpanel">
      @for (group of activeTab().groups; track group.label) {
        <section class="group">
          <div class="group__commands">
            @for (cmd of group.commands; track cmd.label) {
              @if (cmd.link) {
                <a
                  class="cmd"
                  [class.cmd--large]="cmd.size === 'large'"
                  [routerLink]="cmd.link"
                  routerLinkActive="is-active"
                  [matTooltip]="cmd.label"
                  matTooltipShowDelay="600"
                >
                  <mat-icon>{{ cmd.icon }}</mat-icon>
                  <span class="cmd__label">{{ cmd.label }}</span>
                </a>
              } @else {
                <button
                  type="button"
                  class="cmd"
                  [class.cmd--large]="cmd.size === 'large'"
                  [disabled]="isDisabled(cmd)"
                  [matTooltip]="cmd.label"
                  matTooltipShowDelay="600"
                  (click)="command.emit(cmd)"
                >
                  <mat-icon>{{ cmd.icon }}</mat-icon>
                  <span class="cmd__label">{{ cmd.label }}</span>
                </button>
              }
            }
          </div>
          <div class="group__label">{{ group.label }}</div>
        </section>
      }
    </div>
  }
</div>
